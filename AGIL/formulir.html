<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Formulir Pendaftaran Styles */
.enrollment-form {
    max-width: 800px;
    margin: 2rem auto;
    padding: 2.5rem;
    background: var(--dark-gray);
    border-radius: 12px;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    border: 1px solid var(--medium-gray);
  }
  
  .enrollment-form h3 {
    color: var(--primary);
    font-size: 1.75rem;
    margin-bottom: 1.5rem;
    padding-bottom: 0.75rem;
    border-bottom: 2px solid var(--primary);
  }
  
  .form-row {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
  }
  
  .form-group {
    flex: 1;
    margin-bottom: 1rem;
  }
  
  .form-group label {
    display: block;
    margin-bottom: 0.5rem;
    color: var(--light);
    font-weight: 500;
  }
  
  .form-control {
    width: 100%;
    padding: 0.75rem 1rem;
    background: var(--dark);
    border: 1px solid var(--medium-gray);
    border-radius: 8px;
    color: var(--light);
    font-size: 1rem;
    transition: all 0.3s ease;
  }
  
  .form-control:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.3);
  }
  
  select.form-control {
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%636e72'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 1rem center;
    background-size: 1em;
  }
  
  .checkbox-group {
    display: flex;
    align-items: center;
    margin: 2rem 0;
  }
  
  .checkbox-group input {
    width: 18px;
    height: 18px;
    margin-right: 0.75rem;
    accent-color: var(--primary);
  }
  
  .checkbox-group label {
    color: var(--light-gray);
    margin-bottom: 0;
  }
  
  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 1rem;
    margin-top: 2rem;
  }
  
  .btn {
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    border: none;
  }
  
  .btn-primary {
    background-color: var(--primary);
    color: white;
  }
  
  .btn-primary:hover {
    background-color: var(--primary-dark);
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
  }
  
  .btn-secondary {
    background-color: var(--medium-gray);
    color: var(--light);
  }
  
  .btn-secondary:hover {
    background-color: var(--light-gray);
  }
  
  /* Responsive Design */
  @media (max-width: 768px) {
    .form-row {
      flex-direction: column;
      gap: 1rem;
    }
    
    .enrollment-form {
      padding: 1.5rem;
    }
    
    .form-actions {
      justify-content: center;
    }
  }
    </style>
</head>
<body>
    <header>
        <h1>My Profile</h1>
    </header>
    
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="profil.html">Profile</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="formulir.html">Formulir</a></li>
        </ul>
    </nav>
    <div class="enrollment-form">
        <h3>Formulir Pendaftaran Masuk Kampus</h3>
        <form action="#" method="post">
          <div class="form-row">
            <div class="form-group">
              <label for="nama_lengkap">Nama Lengkap</label>
              <input type="text" id="nama_lengkap" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="nim">NIM</label>
              <input type="text" id="nim" class="form-control" required>
            </div>
          </div>
      
          <div class="form-row">
            <div class="form-group">
              <label for="fakultas">Fakultas</label>
              <select id="fakultas" class="form-control" required>
                <option value="">Pilih Fakultas</option>
                <option value="ft">Fakultas Teknik</option>
                <option value="fmipa">Fakultas MIPA</option>
              </select>
            </div>
            <div class="form-group">
              <label for="program_studi">Program Studi</label>
              <input type="text" id="program_studi" class="form-control" required>
            </div>
          </div>
      
          <div class="form-actions">
            <button type="reset" class="btn btn-secondary">Reset Data</button>
            <button type="submit" class="btn btn-primary">Daftar</button>
          </div>
        </form>
      </div>
    
    <footer>
        <p>&copy; 2023 My Website. All rights reserved.</p>
    </footer>
</body>
</html>
